<!-- Module: radius/radius.html (RADIUS Client MITRANE Style Window) -->
<div class="mitrautama-view-section" id="view-radius" style="display: none;">
  <div class="mitrane-window">

    <!-- 1. Window Tab Bar with WinBox Window controls -->
    <div class="mitrane-tab-bar mitrautama-winbox-tabs" id="mitrane-radius-tabs" style="scrollbar-width: none; -ms-overflow-style: none; overflow-x: auto; overflow-y: hidden;">
      <div class="d-flex align-items-center flex-nowrap">
        <button class="mitrane-window-title-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>RADIUS</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ms-1">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <a href="#" class="mitrane-tab-item mitrautama-winbox-tab active" data-mitrautama-subtab="radius-servers">Servers <span class="badge bg-secondary ms-1 mitrane-tab-count-badge">1</span></a>
      </div>
    </div>

    <!-- 2. Window Action Toolbar -->
    <div class="mitrane-toolbar mitrautama-winbox-toolbar">
      <div class="mitrane-action-group mitrautama-toolbar-actions">
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn btn-new" onclick="Swal.fire('RADIUS Server', 'Tambah server AAA RADIUS baru', 'info')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>New</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="toastManager.show({title:'RADIUS', message:'Server RADIUS diaktifkan.', type:'success'})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Enable</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="toastManager.show({title:'RADIUS', message:'Server RADIUS dinonaktifkan.', type:'info'})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <span>Disable</span>
        </button>
      </div>

      <div class="mitrane-filter-box d-flex align-items-center">
        <input type="text" class="form-control form-control-sm mitrautama-filter-input" placeholder="Find / Filter RADIUS..." style="width: 160px; height: 24px; font-size: 0.75rem;">
      </div>
    </div>

    <!-- 3. Tab Contents -->
    <div class="mitrautama-tab-content active" id="subtab-radius-servers">
      <div class="flex-grow-1 overflow-auto mitrautama-table-container" style="border-radius: 0 0 6px 6px; margin-bottom: 0;">
        <table class="mitrane-grid-table mitrautama-table">
          <thead>
            <tr>
              <th>Service</th>
              <th>Address</th>
              <th>Auth Port</th>
              <th>Acct Port</th>
              <th>Timeout</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><span class="badge bg-primary">ppp, hotspot</span></td>
              <td><code>10.10.10.1</code></td>
              <td>1812</td>
              <td>1813</td>
              <td>300 ms</td>
              <td><span class="badge bg-success">Online (Connected)</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 4. Window Status Bar Footer -->
    <div class="mitrane-status-subsystem py-1 px-3 d-flex justify-content-between align-items-center" style="font-size: 0.75rem; border-top: 1px solid rgba(0,0,0,0.08);">
      <span class="text-muted">1 item</span>
      <span class="text-muted" style="font-size: 0.72rem;">AAA Authentication: Active</span>
    </div>

  </div>
</div>

<!-- Module: mpls/mpls.html (MPLS MITRANE Style Window) -->
<div class="mitrautama-view-section" id="view-mpls" style="display: none;">
  <div class="mitrane-window">

    <!-- 1. Window Tab Bar with WinBox Window controls -->
    <div class="mitrane-tab-bar mitrautama-winbox-tabs" id="mitrane-mpls-tabs" style="scrollbar-width: none; -ms-overflow-style: none; overflow-x: auto; overflow-y: hidden;">
      <div class="d-flex align-items-center flex-nowrap">
        <button class="mitrane-window-title-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>MPLS</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ms-1">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <a href="#" class="mitrane-tab-item mitrautama-winbox-tab active" data-mitrautama-subtab="mpls-interfaces">MPLS Interfaces</a>
        <a href="#" class="mitrane-tab-item mitrautama-winbox-tab" data-mitrautama-subtab="mpls-ldp">LDP Neighbors</a>
      </div>
    </div>

    <!-- 2. Window Action Toolbar -->
    <div class="mitrane-toolbar mitrautama-winbox-toolbar">
      <div class="mitrane-action-group mitrautama-toolbar-actions">
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn btn-new" onclick="Swal.fire('MPLS', 'Tambah interface MPLS', 'info')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>New</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="toastManager.show({title:'MPLS', message:'MPLS interface diaktifkan.', type:'success'})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Enable</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="toastManager.show({title:'MPLS', message:'MPLS interface dinonaktifkan.', type:'info'})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <span>Disable</span>
        </button>
      </div>

            <!-- Right Tools: Find Search Box, Filter, Refresh, Columns -->
      <div class="d-flex align-items-center gap-2">
        <div class="input-group input-group-sm" style="width: 170px;">
          <span class="input-group-text border-end-0 py-0 px-2">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" class="form-control form-control-sm border-start-0 py-0 mitrautama-filter-input" placeholder="Find / Filter...">
        </div>

        <button type="button" class="mitrane-toolbar-icon-btn" title="Filter Records" aria-label="Filter">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        </button>
        <button type="button" class="mitrane-toolbar-icon-btn" title="Refresh Table" aria-label="Refresh">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <button type="button" class="mitrane-toolbar-icon-btn" title="Configure Columns" aria-label="Columns">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- 3. Tab Contents -->
    <div class="mitrautama-tab-content active" id="subtab-mpls-interfaces">
      <div class="flex-grow-1 overflow-auto mitrautama-table-container" style="border-radius: 0 0 6px 6px; margin-bottom: 0;">
        <table class="mitrane-grid-table mitrautama-table">
          <thead>
            <tr>
              <th>Interface</th>
              <th>MPLS MTU</th>
              <th>Dynamic Label</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>ether1-WAN</strong></td>
              <td><code>1508</code></td>
              <td>yes</td>
              <td><span class="badge bg-success">Running</span></td>
            </tr>
            <tr>
              <td><strong>vlan50-PPTP</strong></td>
              <td><code>1508</code></td>
              <td>yes</td>
              <td><span class="badge bg-success">Running</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="mitrautama-tab-content" id="subtab-mpls-ldp" style="display: none;">
      <div class="flex-grow-1 overflow-auto mitrautama-table-container" style="border-radius: 0 0 6px 6px; margin-bottom: 0;">
        <table class="mitrane-grid-table mitrautama-table">
          <thead>
            <tr>
              <th>Transport Address</th>
              <th>LDP ID</th>
              <th>State</th>
              <th>Uptime</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>10.255.255.1</code></td>
              <td>10.255.255.1:0</td>
              <td><span class="badge bg-success">Operational</span></td>
              <td>3d 14:02:11</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 4. Window Status Bar Footer -->
    <div class="mitrane-status-subsystem py-1 px-3 d-flex justify-content-between align-items-center" style="font-size: 0.75rem; border-top: 1px solid rgba(0,0,0,0.08);">
      <span class="text-muted">2 items</span>
      <span class="text-muted" style="font-size: 0.72rem;">MPLS Forwarding: Enabled</span>
    </div>

  </div>
</div>

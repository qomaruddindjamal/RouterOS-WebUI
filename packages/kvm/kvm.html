<!-- Module: kvm/kvm.html (KVM Virtual Machines MITRANE Style Window) -->
<div class="mitrautama-view-section" id="view-kvm" style="display: none;">
  <div class="mitrane-window">

    <!-- 1. Window Tab Bar with WinBox Window controls -->
    <div class="mitrane-tab-bar mitrautama-winbox-tabs" id="mitrane-kvm-tabs" style="scrollbar-width: none; -ms-overflow-style: none; overflow-x: auto; overflow-y: hidden;">
      <div class="d-flex align-items-center flex-nowrap">
        <button class="mitrane-window-title-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>KVM</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ms-1">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <a href="#" class="mitrane-tab-item mitrautama-winbox-tab active" data-mitrautama-subtab="kvm-guests">Virtual Machines <span class="badge bg-secondary ms-1 mitrane-tab-count-badge">1</span></a>
        <a href="#" class="mitrane-tab-item mitrautama-winbox-tab" data-mitrautama-subtab="kvm-interfaces">KVM Interfaces</a>
      </div>
    </div>

    <!-- 2. Window Action Toolbar -->
    <div class="mitrane-toolbar mitrautama-winbox-toolbar">
      <div class="mitrane-action-group mitrautama-toolbar-actions">
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn btn-new" onclick="Swal.fire('KVM Guest', 'Tambah Virtual Machine KVM baru', 'info')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>New</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="toastManager.show({title:'KVM Guest', message:'Virtual machine dinyalakan.', type:'success'})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Start</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="toastManager.show({title:'KVM Guest', message:'Virtual machine dimatikan.', type:'info'})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <span>Stop</span>
        </button>
      </div>

      <div class="mitrane-filter-box d-flex align-items-center">
        <input type="text" class="form-control form-control-sm mitrautama-filter-input" placeholder="Find / Filter KVM..." style="width: 160px; height: 24px; font-size: 0.75rem;">
      </div>
    </div>

    <!-- 3. Tab Contents -->
    <div class="mitrautama-tab-content active" id="subtab-kvm-guests">
      <div class="flex-grow-1 overflow-auto mitrautama-table-container" style="border-radius: 0 0 6px 6px; margin-bottom: 0;">
        <table class="mitrane-grid-table mitrautama-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>CPU Cores</th>
              <th>RAM</th>
              <th>Disk Image</th>
              <th>State</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Alpine-DNS-Server</strong></td>
              <td>1 Core</td>
              <td>256 MiB</td>
              <td><code>alpine-virt.img</code></td>
              <td><span class="badge bg-success">Running</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="mitrautama-tab-content" id="subtab-kvm-interfaces" style="display: none;">
      <div class="flex-grow-1 overflow-auto mitrautama-table-container" style="border-radius: 0 0 6px 6px; margin-bottom: 0;">
        <table class="mitrane-grid-table mitrautama-table">
          <thead>
            <tr>
              <th>Interface</th>
              <th>VM Guest</th>
              <th>Bridge</th>
              <th>MAC Address</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>vnet0</code></td>
              <td>Alpine-DNS-Server</td>
              <td>bridge1</td>
              <td><code>52:54:00:12:34:56</code></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 4. Window Status Bar Footer -->
    <div class="mitrane-status-subsystem py-1 px-3 d-flex justify-content-between align-items-center" style="font-size: 0.75rem; border-top: 1px solid rgba(0,0,0,0.08);">
      <span class="text-muted">1 guest</span>
      <span class="text-muted" style="font-size: 0.72rem;">Hardware Virtualization: KVM Intel/AMD Active</span>
    </div>

  </div>
</div>

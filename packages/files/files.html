<!-- Module: files/files.html (Files MITRANE Style Window) -->
<div class="mitrautama-view-section" id="view-files" style="display: none;">
  <div class="mitrane-window">

    <!-- 1. Window Tab Bar with WinBox Window controls -->
    <div class="mitrane-tab-bar mitrautama-winbox-tabs" id="mitrane-files-tabs" style="scrollbar-width: none; -ms-overflow-style: none; overflow-x: auto; overflow-y: hidden;">
      <div class="d-flex align-items-center flex-nowrap">
        <button class="mitrane-window-title-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>File List</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ms-1">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <a href="#" class="mitrane-tab-item mitrautama-winbox-tab active" data-mitrautama-subtab="files-all">Files <span class="badge bg-secondary ms-1 mitrane-tab-count-badge">4</span></a>
      </div>
    </div>

    <!-- 2. Window Action Toolbar -->
    <div class="mitrane-toolbar mitrautama-winbox-toolbar">
      <div class="mitrane-action-group mitrautama-toolbar-actions">
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="Swal.fire('Upload File', 'Pilih file untuk diunggah ke storage RouterOS.', 'info')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span>Upload</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="Swal.fire('Backup Config', 'Membuat file cadangan .backup RouterOS...', 'success')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span>Backup</span>
        </button>
        <button type="button" class="mitrane-btn-action mitrautama-toolbar-btn" onclick="toastManager.show({title:'File Deleted', message:'Pilih file untuk dihapus.', type:'info'})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          <span>Delete</span>
        </button>
      </div>

      <div class="mitrane-filter-box d-flex align-items-center">
        <input type="text" class="form-control form-control-sm mitrautama-filter-input" placeholder="Find / Filter Files..." style="width: 160px; height: 24px; font-size: 0.75rem;">
      </div>
    </div>

    <!-- 3. Table Content -->
    <div class="mitrautama-tab-content active" id="subtab-files-all">
      <div class="flex-grow-1 overflow-auto mitrautama-table-container" style="border-radius: 0 0 6px 6px; margin-bottom: 0;">
        <table class="mitrane-grid-table mitrautama-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Size</th>
              <th>Creation Time</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>backup-daily-routeros.backup</strong></td>
              <td><span class="badge bg-primary">backup</span></td>
              <td><code>1.4 MiB</code></td>
              <td class="text-muted">2026-10-23 04:00:15</td>
            </tr>
            <tr>
              <td><strong>autosupout.rif</strong></td>
              <td><span class="badge bg-secondary">support</span></td>
              <td><code>512 KiB</code></td>
              <td class="text-muted">2026-10-22 11:20:00</td>
            </tr>
            <tr>
              <td><strong>flash/skins</strong></td>
              <td><span class="badge bg-info">directory</span></td>
              <td><code>-</code></td>
              <td class="text-muted">2026-10-20 09:15:30</td>
            </tr>
            <tr>
              <td><strong>client_cert.crt</strong></td>
              <td><span class="badge bg-success">certificate</span></td>
              <td><code>4.2 KiB</code></td>
              <td class="text-muted">2026-10-21 16:40:02</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 4. Window Status Bar Footer -->
    <div class="mitrane-status-subsystem py-1 px-3 d-flex justify-content-between align-items-center" style="font-size: 0.75rem; border-top: 1px solid rgba(0,0,0,0.08);">
      <span class="text-muted">4 items</span>
      <span class="text-muted" style="font-size: 0.72rem;">Disk Free: 112.5 MiB / Total: 128.0 MiB</span>
    </div>

  </div>
</div>

<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RouterOS WebUI</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

    <!-- Bootstrap 5.3.3 -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="assets/css/sweetalert2.min.css" rel="stylesheet">

    <!-- MitraUtama CSS Tokens & System -->
    <link rel="stylesheet" id="theme-stylesheet" href="assets/css/mitrautama.css">
    <link rel="stylesheet" id="auto-theme-stylesheet" href="assets/css/mitrautama-auto.css">
    <link rel="stylesheet" href="assets/css/mitrautama-tabel.css">
    <link rel="stylesheet" href="assets/css/mitrautama-tost.css">
    <link rel="stylesheet" href="assets/css/mitrautama-all-min.css">

    <!-- MD5 Hash Library for CHAP Authentication -->
    <script src="md5.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="assets/js/sweetalert2.all.min.js"></script>

    <style>
        :root {
            --login-card-bg: rgba(255, 255, 255, 0.98);
            --login-card-border: #cbd5e1;
            --login-card-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12), 0 10px 20px -5px rgba(15, 23, 42, 0.06);
            --login-badge-bg: #e0f2fe;
            --login-badge-text: #0284c7;
        }

        [data-theme="dark"],
        [data-period="malam"] {
            --login-card-bg: rgba(30, 41, 59, 0.96);
            --login-card-border: #334155;
            --login-card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            --login-badge-bg: rgba(56, 189, 248, 0.12);
            --login-badge-text: #38bdf8;
        }

        body.mitrautama-login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--mu-bg, #f1f5f9) 0%, #e2e8f0 100%);
            color: var(--mu-text-main, #0f172a);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px 16px;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        [data-theme="dark"] body.mitrautama-login-body,
        [data-period="malam"] body.mitrautama-login-body {
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
        }

        .mitrautama-login-card {
            width: 100%;
            max-width: 420px;
            background: var(--login-card-bg);
            border: 1px solid var(--login-card-border);
            border-radius: 12px;
            box-shadow: var(--login-card-shadow);
            backdrop-filter: blur(10px);
            padding: 34px 28px 28px 28px;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .mitrautama-form-control {
            background: var(--mu-surface, #ffffff);
            border: 1px solid var(--mu-border, #cbd5e1);
            color: var(--mu-text-main, #0f172a);
            font-size: 0.875rem;
            border-radius: 6px;
            padding: 10px 14px 10px 40px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        [data-theme="dark"] .mitrautama-form-control,
        [data-period="malam"] .mitrautama-form-control {
            background: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }

        .mitrautama-form-control:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            outline: none;
        }

        .mitrautama-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .mitrautama-input-icon {
            position: absolute;
            left: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mu-text-muted, #94a3b8);
            pointer-events: none;
            z-index: 3;
        }

        .mitrautama-input-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--mu-text-muted, #94a3b8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            cursor: pointer;
            z-index: 3;
            border-radius: 4px;
        }

        .mitrautama-input-btn:hover {
            color: var(--mu-text-main, #0f172a);
        }

        .btn-mitrautama-primary {
            background: #0284c7;
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 11px 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
            cursor: pointer;
        }

        .btn-mitrautama-primary:hover {
            background: #0369a1;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4);
            transform: translateY(-1px);
        }

        .btn-mitrautama-primary:active {
            transform: translateY(0);
        }

        @media (max-width: 576px) {
            .mitrautama-login-card {
                padding: 24px 18px 20px 18px;
                border-radius: 10px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            }
        }
    </style>
</head>
<body class="mitrautama-login-body">

    <!-- Main Responsive Login Card (Centered, No Header, No Footer) -->
    <div class="mitrautama-login-card">
        
        <!-- Branding Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-2 rounded-circle mb-2" style="background: var(--login-badge-bg); color: var(--login-badge-text);">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                    <line x1="6" y1="6" x2="6.01" y2="6"></line>
                    <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
            </div>
            <h4 class="fw-bold mb-1" style="color: var(--mu-text-main, #0f172a); font-size: 1.25rem;">MitraUtama WebUI</h4>
            <div class="d-flex align-items-center justify-content-center gap-2">
                <span class="badge" style="background: var(--login-badge-bg); color: var(--login-badge-text); font-weight: 600; font-size: 0.72rem;">RouterOS v7.24.5</span>
                <span class="badge bg-secondary" style="font-size: 0.72rem;">BACKBONE</span>
            </div>
        </div>

        <!-- Login Form (Username & Password) -->
        <form id="mitrautama-login-form" name="login" action="login" method="post" autocomplete="on">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <!-- Input Username -->
            <div class="mb-3">
                <label for="username-input" class="form-label fw-semibold small mb-1" style="font-size: 0.8rem;">
                    Username
                </label>
                <div class="mitrautama-input-group">
                    <span class="mitrautama-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" class="mitrautama-form-control" id="username-input" name="username" placeholder="Masukkan Username" required autofocus>
                </div>
            </div>

            <!-- Input Password -->
            <div class="mb-3" id="password-field">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password-input" class="form-label fw-semibold small mb-0" style="font-size: 0.8rem;">
                        Password
                    </label>
                    <span class="text-muted" style="font-size: 0.72rem;">Case-sensitive</span>
                </div>
                <div class="mitrautama-input-group">
                    <span class="mitrautama-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" class="mitrautama-form-control" id="password-input" name="password" placeholder="Masukkan Password" required style="padding-right: 40px;">
                    <button type="button" class="mitrautama-input-btn" id="toggle-password" title="Tampilkan/Sembunyikan Kata Sandi">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Remember Me & Back to Dashboard -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember-me" checked>
                    <label class="form-check-label small text-muted" for="remember-me" style="font-size: 0.785rem;">
                        Ingat Sesi Ini
                    </label>
                </div>
                <a href="index.html" class="text-decoration-none small" style="font-size: 0.785rem; color: #0284c7;">
                    WebUI Dashboard &rarr;
                </a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-mitrautama-primary" id="btn-login-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                <span>Masuk ke Jaringan</span>
            </button>
        </form>

        <!-- Status Indicator / Hotspot Info -->
        <div class="mt-4 pt-3 border-top text-center" style="border-color: var(--mu-border, #e2e8f0) !important;">
            <div class="d-flex justify-content-center align-items-center gap-3 text-muted" style="font-size: 0.73rem;">
                <span class="d-flex align-items-center gap-1">
                    <span style="width: 7px; height: 7px; border-radius: 50%; background-color: #16a34a; display: inline-block;"></span>
                    RADIUS Online
                </span>
                <span class="d-flex align-items-center gap-1">
                    <span style="width: 7px; height: 7px; border-radius: 50%; background-color: #0284c7; display: inline-block;"></span>
                    CHAP MD5 Active
                </span>
            </div>
        </div>

    </div>

    <!-- Script Wiring -->
    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            // Password Visibility Toggle
            const togglePwd = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password-input');
            if (togglePwd && passwordInput) {
                togglePwd.addEventListener('click', () => {
                    const isPass = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPass ? 'text' : 'password');
                    togglePwd.style.color = isPass ? '#0284c7' : 'var(--mu-text-muted, #94a3b8)';
                });
            }

            // Form Submit Interceptor
            const loginForm = document.getElementById('mitrautama-login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    const username = document.getElementById('username-input').value.trim();
                    const password = document.getElementById('password-input').value;

                    if (!username || !password) {
                        e.preventDefault();
                        if (window.Swal) {
                            Swal.fire({
                                icon: 'warning',
                                title: 'Input Belum Lengkap',
                                text: 'Silakan masukkan Username dan Password Anda.'
                            });
                        } else {
                            alert('Silakan masukkan Username dan Password Anda.');
                        }
                        return;
                    }

                    // Jika berada di live server hotspot MikroTik dengan variable $(chap-id)
                    if (typeof hexMD5 === 'function' && window.chapId && window.chapChallenge) {
                        const chapPass = hexMD5(window.chapId + password + window.chapChallenge);
                    } else {
                        // Environment WebUI Standalone / Dashboard Access Simulation
                        e.preventDefault();
                        if (window.Swal) {
                            Swal.fire({
                                icon: 'success',
                                title: 'Login Berhasil',
                                text: `Selamat datang, ${username}! Mengarahkan ke Dashboard...`,
                                timer: 1200,
                                showConfirmButton: false
                            }).then(() => {
                                window.location.href = 'index.html';
                            });
                        } else {
                            alert(`Login berhasil! Selamat datang, ${username}`);
                            window.location.href = 'index.html';
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>

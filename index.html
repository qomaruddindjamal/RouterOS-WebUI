<head>

    <link href="assets/css/bootstrap.min.css" rel="stylesheet">

    <!-- SweetAlert2 CSS -->
    <link href="assets/css/sweetalert2.min.css" rel="stylesheet">

    <!-- Early Theme Detection & Pre-activation (Prevent Flash of Light Theme on Refresh) -->
    <script>
        (function() {
            try {
                var mode = localStorage.getItem('mitra_theme_mode') || 'auto';
                var d = new Date();
                var timeVal = d.getHours() * 60 + d.getMinutes();
                var period = 'malam';
                if (timeVal >= 4 * 60 && timeVal < 6 * 60 + 15) period = 'fajar';
                else if (timeVal >= 6 * 60 + 15 && timeVal < 11 * 60 + 30) period = 'pagi';
                else if (timeVal >= 11 * 60 + 30 && timeVal < 16 * 60) period = 'siang';
                else if (timeVal >= 16 * 60 && timeVal < 18 * 60) period = 'senja';

                if (mode === 'dark' || (mode === 'auto' && period === 'malam')) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
                if (mode === 'auto') {
                    document.documentElement.setAttribute('data-period', period);
                }
            } catch (e) {}
        })();
    </script>

    <!-- CSS MitraUtama Modular (Awalan mitrautama-) -->
    <link rel="stylesheet" id="theme-stylesheet" href="assets/css/mitrautama.css">
    <link rel="stylesheet" id="auto-theme-stylesheet" href="assets/css/mitrautama-auto.css">
    <script>
        (function() {
            try {
                var mode = localStorage.getItem('mitra_theme_mode') || 'auto';
                var d = new Date();
                var timeVal = d.getHours() * 60 + d.getMinutes();
                var isNight = !(timeVal >= 4 * 60 && timeVal < 18 * 60);
                var isDark = mode === 'dark' || (mode === 'auto' && isNight);
                var themeEl = document.getElementById('theme-stylesheet');
                var autoEl = document.getElementById('auto-theme-stylesheet');
                if (themeEl && isDark) {
                    themeEl.href = 'assets/css/mitrautama-dark.css';
                }
                if (autoEl && mode !== 'auto') {
                    autoEl.disabled = true;
                }
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="assets/css/mitrautama-tabel.css">
    <link rel="stylesheet" href="assets/css/mitrautama-tost.css">
    <link rel="stylesheet" href="assets/css/mitrautama-all-min.css?v=1792774500">

    <!-- SweetAlert2 JS CDN -->
    <script src="assets/js/sweetalert2.all.min.js"></script>

                        </div>

                                        <span>Realtime Traffic Graph - Interface "1. WAN"</span>
                                    </div>
                                    <span class="badge bg-success-subtle text-success border border-success-subtle">Live 2s</span>
                                </div>

                            </div>
                        </div>
                        <div class="col-lg-4">

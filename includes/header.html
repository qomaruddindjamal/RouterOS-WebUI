<!-- Module: includes/header.html (Unified WinBox Header) -->
<header class="mitrautama-fixed-header">
    <div class="d-flex align-items-center gap-2">
        <a href="#" class="mitrautama-header-home-btn d-flex align-items-center gap-2 text-decoration-none" data-mitrautama-view="dashboard">
            <div class="mu-logo-icon" style="width: 30px; height: 30px; font-size: 0.9rem;">MU</div>
            <div class="d-none d-sm-block mu-brand-text">
                <strong style="font-size: 0.95rem; color: var(--mu-text-main, #0f172a);">MitraUtama WebUI</strong>
                <span class="badge bg-primary text-white ms-2" style="font-size: 0.7rem;">RB3011UiAS</span>
            </div>
        </a>

        <button type="button" id="sidebar-toggle-btn" class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center p-1 ms-1" style="width: 32px; height: 32px;" title="Ciutkan / Perluas Sidebar" aria-label="Toggle Sidebar" aria-expanded="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Right Controls: Domain/Hostname badge, Theme Selector, Period Badge, Router Modal, Notifications -->
    <div class="d-flex align-items-center gap-2 gap-md-3">

        <div class="mu-period-badge mb-0 d-none d-lg-inline-flex" id="period-badge">
            <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle></svg></span> <span>Mode Auto: Pagi</span>
        </div>

        <!-- Theme Mode Selector Dropdown / Buttons -->
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle py-1 px-2 d-flex align-items-center gap-1" type="button" id="themeDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 0.75rem;">
                <span id="current-theme-label">Auto Theme</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="themeDropdown">
                <li><a class="dropdown-item" href="#" data-theme-set="auto" data-mitrautama-theme="auto">🕒 Auto (Waktu Tropis)</a></li>
                <li><a class="dropdown-item" href="#" data-theme-set="light" data-mitrautama-theme="light">☀️ Light (Cerah)</a></li>
                <li><a class="dropdown-item" href="#" data-theme-set="dark" data-mitrautama-theme="dark">🌙 Dark (Gelap)</a></li>
            </ul>
        </div>

        <button type="button" class="btn btn-sm btn-primary d-flex align-items-center gap-1" data-mitrautama-modal-open="modal-router-status">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="d-none d-sm-inline">Router</span>
        </button>
    </div>
</header>

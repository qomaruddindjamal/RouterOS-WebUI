<!-- Module: includes/header.html (Unified WinBox Header) -->
<header class="mitrautama-fixed-header">
    <div class="mitrautama-header-left d-flex align-items-center">
        <a href="#" class="mitrautama-header-home-btn d-flex align-items-center gap-2 text-decoration-none" data-mitrautama-view="dashboard">
            <div class="mu-logo-icon" style="width: 30px; height: 30px; font-size: 0.9rem;">RO</div>
            <div class="d-none d-sm-block mu-brand-text">
                <strong style="font-size: 0.95rem; color: var(--mu-text-main, #0f172a);">RouterOS</strong>
                
            </div>
        </a>

        <button type="button" id="sidebar-toggle-btn" class="btn btn-sm d-flex align-items-center justify-content-center p-0 border-0 bg-transparent" style="width: 32px; height: 32px;" title="Ciutkan / Perluas Sidebar" aria-label="Toggle Sidebar" aria-expanded="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>

        <!-- Right Controls: User Profile Dropdown (with Router Status, Theme, and Logout) -->
    <div class="mitrautama-header-right d-flex align-items-center gap-2 ms-auto">
        <div class="dropdown">
            <button class="btn btn-sm d-flex align-items-center justify-content-center p-0 rounded-circle shadow-sm" type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Profil Pengguna (admin)" style="width: 34px; height: 34px;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 py-2" aria-labelledby="userMenuDropdown" style="min-width: 220px; border-radius: 8px;">
                <li class="px-3 py-1 mb-1 border-bottom">
                    <div class="fw-bold small text-truncate" style="color: var(--mu-text-main, #1e293b);">Administrator</div>
                    <div class="text-muted" style="font-size: 0.72rem;">admin@RB3011UiAS</div>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#" data-mitrautama-modal-open="modal-router-status">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2-2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span>Status Router</span>
                    </a>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#" data-mitrautama-view="system-resources">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                            <line x1="8" y1="21" x2="16" y2="21"></line>
                            <line x1="12" y1="17" x2="12" y2="21"></line>
                        </svg>
                        <span>System Resources</span>
                    </a>
                </li>
                <li><hr class="dropdown-divider my-1"></li>
                <li>
                    <div class="px-3 py-1 text-muted small fw-semibold" style="font-size: 0.72rem;">PILIHAN TEMA</div>
                </li>
                <li>
                    <button type="button" class="dropdown-item d-flex align-items-center justify-content-between py-1 px-3 small" data-theme-set="auto" data-mitrautama-theme="auto">
                        <span class="d-flex align-items-center gap-2">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            Auto (Waktu)
                        </span>
                    </button>
                </li>
                <li>
                    <button type="button" class="dropdown-item d-flex align-items-center justify-content-between py-1 px-3 small" data-theme-set="light" data-mitrautama-theme="light">
                        <span class="d-flex align-items-center gap-2">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                            Cerah (Light)
                        </span>
                    </button>
                </li>
                <li>
                    <button type="button" class="dropdown-item d-flex align-items-center justify-content-between py-1 px-3 small" data-theme-set="dark" data-mitrautama-theme="dark">
                        <span class="d-flex align-items-center gap-2">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            Gelap (Dark)
                        </span>
                    </button>
                </li>
                <li><hr class="dropdown-divider my-1"></li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger fw-semibold" href="#" id="header-btn-logout">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H45a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- Module: includes/header.html (MITRANE Style) -->
<header class="mitrautama-fixed-header">
    <div class="d-flex align-items-center gap-2">
        <button type="button" id="sidebar-toggle-btn" class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center p-1 text-light border-secondary" style="width: 30px; height: 30px;" title="Ciutkan / Perluas Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <a href="#" class="mitrautama-header-home-btn" data-mitrautama-view="dashboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>
    </div>

    <!-- Right Controls: Domain/Hostname badge, Theme, Notifications -->
    <div class="d-flex align-items-center gap-3">
        <div class="mitrautama-header-host-badge d-none d-md-flex">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                <line x1="6" y1="6" x2="6.01" y2="6"></line>
                <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <span id="mitrane-header-host">mitranet.citramedia.group.localdomain</span>
        </div>

        <!-- Quick Theme Mode Toggle -->
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle text-light border-secondary py-1 px-2" type="button" id="themeDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 0.75rem;">
                <span id="current-theme-label">Auto Theme</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="themeDropdown">
                <li><a class="dropdown-item" href="#" data-mitrautama-theme="auto">🕒 Auto (Waktu: Fajar-Malam)</a></li>
                <li><a class="dropdown-item" href="#" data-mitrautama-theme="light">☀️ Light (MitraUtama)</a></li>
                <li><a class="dropdown-item" href="#" data-mitrautama-theme="dark">🌙 Dark (Midnight)</a></li>
            </ul>
        </div>

        <!-- Notification Bell -->
        <button class="btn btn-sm btn-link text-light p-0 position-relative" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                <span class="visually-hidden">New alerts</span>
            </span>
        </button>
    </div>
</header>
